name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  XOVI_COMMIT: 0c8d5269b55c851901d4e4a754dc2d7deab40b17
  TOOLCHAIN_IMAGE: eeems/remarkable-toolchain:latest-rmpp@sha256:0d6ec46299b535a82e883e7578905a3e68dc30881bc0736f2f0d4c7cdff0da6f

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install --yes shellcheck

      - name: Check shell and PowerShell syntax
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t scripts < <(find scripts tests src/controller -type f \( -name '*.sh' -o -name 'remote-share-control' \) -print)
          shellcheck "${scripts[@]}"
          pwsh -NoProfile -Command '$null = [scriptblock]::Create((Get-Content -Raw scripts/install.ps1)); $null = [scriptblock]::Create((Get-Content -Raw scripts/privacy-check.ps1))'

      - name: Run mocked tests
        run: |
          tests/test-controller.sh
          tests/test-device-install.sh
          tests/test-qmd.sh

      - name: Scan public source
        run: scripts/privacy-check.sh working

      - name: Fetch pinned XOVI source
        run: |
          mkdir -p .tools
          git init .tools/xovi
          git -C .tools/xovi remote add origin https://github.com/asivery/xovi.git
          git -C .tools/xovi fetch --depth=1 origin "$XOVI_COMMIT"
          git -C .tools/xovi checkout --detach FETCH_HEAD
          test "$(git -C .tools/xovi rev-parse HEAD)" = "$XOVI_COMMIT"

      - name: Build Paper Pro extension
        run: |
          mkdir -p build
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --volume "$PWD:/work" \
            --workdir /work \
            "$TOOLCHAIN_IMAGE" \
            bash -lc 'source /opt/codex/ferrari/5.8.203/environment-setup-cortexa53-crypto-remarkable-linux && make -C src/loopback-importer XOVI_REPO=/work/.tools/xovi && cp src/loopback-importer/loopback-importer.so build/'
          file build/loopback-importer.so | grep -Fq 'ARM aarch64'

      - name: Build and inspect release bundle
        run: |
          scripts/build-release.sh
          tests/test-release.sh
          (cd dist && sha256sum --check SHA256SUMS)

      - name: Upload release candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: remarkable-remote-share-0.1.0
          path: |
            dist/remarkable-remote-share-0.1.0.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
